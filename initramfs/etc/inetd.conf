# [ADDR:]service_name		must be in /etc/services, or port number
# socket_type			stream/dgram/raw/rdm/seqpacket
# protocol			tcp/udp
# wait/nowait[.max]		wait is usually for udp, nowait for tcp
#				max: max copies to run
# user[.group] or user[:group]	user and group to run under
# program_path			program to run
# arg0 arg1 arg2 ...		arguments, INCLUDING program name (arg0)

# Nothing is served from here.  There used to be an ssh entry starting
# dropbear per connection with -s -g, which forbids password logins and
# forbids them for root in particular, and without a host key on top of that.
# It held port 22 while being unable to let anyone in, so SSH had to move to
# 2222.  The standalone dropbear started by /etc/init.d/network.sh now takes
# port 22 instead.
